<h3>User Form</h3>

<form [formGroup]="userForm">

    <div class="mb-3">

        <label>Name</label>

        <input
          type="text"
          class="form-control"
          formControlName="name">

    </div>

    <div class="mb-3">

        <label>Age</label>

        <input
          type="number"
          class="form-control"
          formControlName="age">

    </div>

    <button
      type="button"
      class="btn btn-success"
      (click)="save()">
      Save
    </button>

</form>
