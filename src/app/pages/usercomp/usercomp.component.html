<div class="card container mb-2">
  <div class="d-flex justify-content-end align-items-center m-2">
    <button type="button" class="btn btn-success" (click)="adduser()">
      Add User
    </button>
  </div>
</div>
<div class="container" style="min-height: 100px">
  <table border="1" width="100%" cellpadding="10">
    <thead>
      <tr>
        <th>Select ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td><input type="checkbox" (change)="selection($event, user)" /></td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.phone }}</td>
        <td>
          <button type="button" class="btn btn-primary me-2" (click)="editUser(user)">Edit</button>

          <button type="button" class="btn btn-danger" (click)="deleteUser(user.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <hr />
  <button class="btn btn-primary w-100" type="submit" (click)="onsubmit()">
    Submit
  </button>
</div>
<hr />
<h3>Submitted Users:</h3>
<li *ngFor="let user of submittedusers">
  {{ user.username }} - {{ user.email }} - {{ user.phone }}
</li>
