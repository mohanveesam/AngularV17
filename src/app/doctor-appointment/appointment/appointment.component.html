<div>

    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="openDialog()"
    >
      Add
    </button>
</div>
<div class="table-container card">
  <table mat-table [dataSource]="appointments" border="1" class="mat-elevation">
    <ng-container matColumnDef="patientName">
      <th mat-header-cell *matHeaderCellDef>Patient Name</th>
      <td mat-cell *matCellDef="let row">{{ row.patientName }}</td>
    </ng-container>

    <ng-container matColumnDef="doctorName">
      <th mat-header-cell *matHeaderCellDef>Doctor Name</th>
      <td mat-cell *matCellDef="let row">{{ row.doctorName }}</td>
    </ng-container>

    <ng-container matColumnDef="appointmentDate">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let row">
        {{ row.appointmentDate | date }}
      </td>
    </ng-container>

    <ng-container matColumnDef="appointmentTime">
      <th mat-header-cell *matHeaderCellDef>Time</th>
      <td mat-cell *matCellDef="let row">
        {{ row.appointmentTime }}
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">
        {{ row.status }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>

      <td mat-cell *matCellDef="let row; let i = index">
        <button mat-raised-button color="primary" (click)="openDialog(row, i)">
          Edit
        </button>
        <button mat-raised-button color="warn" (click)="deleteAppointment(i)">
          Delete
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
