<h2 mat-dialog-title>
  {{ data ? "Edit Visitor" : "Add Visitor" }}
</h2>
<form [formGroup]="visitorForm" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
      <mat-error
        *ngIf="
          visitorForm.get('name')?.touched &&
          visitorForm.get('name')?.hasError('required')
        "
      >
        Name is required
      </mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Aadhaar Number</mat-label>
      <input matInput formControlName="aadhaarNumber" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Phone Number</mat-label>
      <input matInput formControlName="phoneNumber" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Purpose</mat-label>
      <input matInput formControlName="purpose" />
    </mat-form-field>
    <div formArrayName="skills">
      <div
        *ngFor="let skill of skills.controls; let i = index"
        [formGroupName]="i"
      >
        <mat-form-field appearance="outline">
          <mat-label>Skill</mat-label>

          <input matInput formControlName="skillName" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Experience</mat-label>

          <input matInput type="number" formControlName="experience" />
        </mat-form-field>

        <button 
          type="button"
          mat-icon-button
          color="warn"
          (click)="removeSkill(i)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>

    <button type="button" mat-raised-button (click)="addSkill()">
      Add Skill
    </button>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-button mat-dialog-close>Cancel</button>

    <button
      mat-raised-button
      color="primary"
      type="submit"
      [disabled]="visitorForm.invalid"
    >
      {{ data ? "Update" : "Submit" }}
    </button>
  </mat-dialog-actions>
</form>
