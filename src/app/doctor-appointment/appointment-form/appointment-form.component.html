<h2 mat-dialog-title>
  {{ data ? "Edit Appointment" : "Add Appointment" }}
</h2>

<div class="p-3">
  <form [formGroup]="appointForm" (ngSubmit)="onSubmit()">
    <!-- Patient Name -->
    <div class="row">
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Patient Name</mat-label>

          <input matInput formControlName="patientName" />

          <mat-error *ngIf="f['patientName'].hasError('required')">
            Patient name is required
          </mat-error>
        </mat-form-field>
      </div>
    </div>
    <!-- Doctor Name -->
    <div class="row">
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Doctor Name</mat-label>

          <input matInput formControlName="doctorName" />

          <mat-error *ngIf="f['doctorName'].hasError('required')">
            Doctor name is required
          </mat-error>
        </mat-form-field>
      </div>
      <!-- Department -->
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Department</mat-label>

          <input matInput formControlName="department" />
        </mat-form-field>
      </div>
    </div>
    <!-- Date -->
    <div class="row">
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Choose a date</mat-label>
          <input
            matInput
            [matDatepicker]="picker" [min]="minDate"
            formControlName="appointmentDate"
          />
          <!-- <mat-hint>MM/DD/YYYY</mat-hint> -->
          <mat-datepicker-toggle
            matIconSuffix
            [for]="picker"
          ></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
      <!-- Time -->
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Time Slot</mat-label>

          <mat-select formControlName="appointmentTime">
            <mat-option *ngFor="let time of timeSlots" [value]="time">
              {{ time }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
    <!-- Priority -->
    <div class="row">
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Priority</mat-label>

          <mat-select formControlName="priority">
            <mat-option *ngFor="let priority of priorities" [value]="priority">
              {{ priority }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <!-- Status -->
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Status</mat-label>

          <mat-select formControlName="status">
            <mat-option *ngFor="let status of statuses" [value]="status">
              {{ status }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
    <!-- Notes -->

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Notes</mat-label>

      <textarea matInput rows="1" formControlName="notes"> </textarea>
    </mat-form-field>
    <hr />
    <button mat-button  type="button" (click)="close()">Close</button>
    <button mat-raised-button color="primary" [disabled]="appointForm.invalid">
      {{ data ? "Update" : "Submit" }}
    </button>
  </form>
</div>
