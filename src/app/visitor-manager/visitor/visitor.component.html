<mat-card>
  <div class="header">
    <button mat-raised-button color="primary" (click)="openVisitorForm()">
      Add Visitor
    </button>
  </div>
</mat-card>

<br />

<mat-card>
  <div class="table-container">
  <table mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>

      <td mat-cell *matCellDef="let row">
        {{ row.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="aadhaarNumber">
      <th mat-header-cell *matHeaderCellDef>Aadhaar Number</th>

      <td mat-cell *matCellDef="let row">
        {{ row.aadhaarNumber }}
      </td>
    </ng-container>

    <ng-container matColumnDef="phoneNumber">
      <th mat-header-cell *matHeaderCellDef>Phone Number</th>

      <td mat-cell *matCellDef="let row">
        {{ row.phoneNumber }}
      </td>
    </ng-container>

    <ng-container matColumnDef="purpose">
      <th mat-header-cell *matHeaderCellDef>Purpose</th>

      <td mat-cell *matCellDef="let row">
        {{ row.purpose }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>

      <td mat-cell *matCellDef="let row; let i = index">
        <button mat-icon-button color="primary" (click)="openVisitorForm(row)">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button color="warn" (click)="deleteVisitor(row.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
  <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]">
  </mat-paginator>
</mat-card>
